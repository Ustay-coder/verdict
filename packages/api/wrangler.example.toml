# Cloudflare Workers deployment (copy to wrangler.toml). Build first: pnpm build
name = "verdict-api"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Persistence: Cloudflare D1 through Drizzle. Create with `wrangler d1 create verdict`, paste the id below, then
#   wrangler d1 migrations apply verdict --local     # dev
#   wrangler d1 migrations apply verdict --remote    # prod
[[d1_databases]]
binding = "DB"
database_name = "verdict"
database_id = "<paste-from-wrangler-d1-create>"
migrations_dir = "../db/drizzle"

# Secrets (wrangler secret put <NAME>):
#   TYPESAFE_API_KEY         Jev (default judge)
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN   Clef / Clef-flash via Workers AI REST
#   VERDICT_API_KEYS         bootstrap tenant keys, "key:tenant,..." (DB-managed keys take precedence)
#   VERDICT_ADMIN_KEY        enables /v1/admin/* (key management, hub takedowns)
#   VERDICT_WEBHOOK_SECRET   HMAC for webhook deliveries
#   GITHUB_CLIENT_ID         hub sign-in: OAuth App client id (enable "Device Flow" in the app's settings)
#   GITHUB_CLIENT_SECRET     hub sign-in: lets the hub check a token was minted for this app (recommended)

# Hub limits shared across isolates (Workers Rate Limiting API; period is 10 or 60 seconds; `wrangler dev` simulates them). Without these bindings the
# same limits are counted per isolate, which is a floor, not a guarantee. namespace_id: any number unique in your account.
# [[ratelimits]]
# name = "HUB_LOGIN_LIMITER"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }
# [[ratelimits]]
# name = "HUB_PUBLISH_LIMITER"
# namespace_id = "1002"
# simple = { limit = 30, period = 60 }
# [[ratelimits]]
# name = "HUB_READ_LIMITER"
# namespace_id = "1003"
# simple = { limit = 300, period = 60 }

# Clef inference through the Worker binding (no REST token needed):
[ai]
binding = "AI"

# Create verdict-jobs and verdict-dlq before enabling (Queues plan required):
# [[queues.producers]]
# binding = "QUEUE"
# queue = "verdict-jobs"
# [[queues.consumers]]
# queue = "verdict-jobs"
# max_retries = 5
# max_batch_size = 10
# max_concurrency = 4
# dead_letter_queue = "verdict-dlq"
