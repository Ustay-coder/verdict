<!DOCTYPE html>
<html lang="en" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Pulse</title>
<link rel="stylesheet" href="design-system/primer.css">
<style>
  .page { max-width: 1280px; margin: 0 auto; padding: var(--base-size-24); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--base-size-16); }
  .main-grid { display: grid; grid-template-columns: 3fr 2fr; gap: var(--base-size-24); align-items: start; }
  .signup-row { display: grid; grid-template-columns: 64px 1fr 48px; gap: var(--base-size-16); align-items: center; }
  .plan-row { display: grid; grid-template-columns: 1fr auto; gap: var(--base-size-4) var(--base-size-16); }
  .tnum { font-variant-numeric: tabular-nums; }
  @media (max-width: 1012px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .main-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="Subhead">
    <h1 class="Subhead-heading f3" id="product"></h1>
    <div class="Subhead-description" id="subtitle"></div>
  </div>

  <nav class="UnderlineNav mb-4" aria-label="Sections">
    <div class="UnderlineNav-body">
      <a class="UnderlineNav-item selected" href="#overview" aria-current="page">Overview</a>
      <a class="UnderlineNav-item" href="#signups">Signups <span class="Counter" id="cWeeks"></span></a>
      <a class="UnderlineNav-item" href="#plans">Plans <span class="Counter" id="cPlans"></span></a>
      <a class="UnderlineNav-item" href="#activity">Activity <span class="Counter" id="cEvents"></span></a>
    </div>
  </nav>

  <div class="flash mb-4" id="note"></div>

  <section class="kpi-grid mb-4" id="overview" aria-label="Key metrics"></section>

  <div class="main-grid">
    <div>
      <div class="Box mb-4" id="signups">
        <div class="Box-header d-flex flex-items-center">
          <h2 class="Box-title flex-auto">Weekly signups</h2>
          <span class="color-fg-muted text-small mr-2 tnum" id="signupTotal"></span>
          <span class="Label Label--success tnum" id="signupGrowth"></span>
        </div>
        <div id="signupRows"></div>
      </div>

      <div class="Box" id="activity">
        <div class="Box-header">
          <h2 class="Box-title">Recent account events</h2>
        </div>
        <div id="events"></div>
      </div>
    </div>

    <div class="Box" id="plans">
      <div class="Box-header">
        <h2 class="Box-title">MRR by plan</h2>
      </div>
      <div class="Box-body">
        <div class="d-flex flex-justify-between mb-2">
          <span class="text-bold">Total MRR</span>
          <span class="color-fg-muted tnum" id="planTotal"></span>
        </div>
        <span class="Progress" id="planBar"></span>
      </div>
      <div id="planRows"></div>
    </div>
  </div>

  <p class="color-fg-muted text-small mt-4" id="footer"></p>
</div>

<script>
(async () => {
  const DATA = await (await fetch("data.json")).json();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const int = (n) => n.toLocaleString("en-US");
  const usd = (n) => "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  const usd2 = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const k = DATA.kpis, weeks = DATA.weekly_signups, plans = DATA.plans, events = DATA.recent_events;
  const totalMrr = plans.reduce((s, p) => s + p.mrr_usd, 0);

  document.title = `${DATA.product} · ${DATA.period}`;
  $("product").textContent = DATA.product;
  $("subtitle").textContent = `Revenue and growth analytics for ${DATA.period}`;
  $("note").textContent = DATA.note;
  $("footer").textContent = `${DATA.product} · ${DATA.period}`;
  $("cWeeks").textContent = weeks.length;
  $("cPlans").textContent = plans.length;
  $("cEvents").textContent = events.length;

  // KPIs
  const kpis = [
    { label: "Monthly recurring revenue", value: usd(k.mrr_usd), badge: `+${k.mrr_change_pct}%`, cls: "Label--success", note: "vs last month" },
    { label: "Active accounts", value: int(k.active_accounts), badge: `+${k.active_accounts_change}`, cls: "Label--success", note: "net new this month" },
    { label: "Churn rate", value: `${k.churn_rate_pct}%`, badge: "Monthly", cls: "Label--secondary", note: "share of accounts lost" },
    { label: "Trial to paid", value: `${k.trial_to_paid_pct}%`, badge: "Conversion", cls: "Label--secondary", note: "trials that became paid" },
  ];
  $("overview").innerHTML = kpis.map((d) => `
    <div class="Box">
      <div class="Box-body">
        <div class="color-fg-muted">${d.label}</div>
        <div class="f1 text-semibold tnum my-2">${d.value}</div>
        <div class="d-flex flex-items-center">
          <span class="Label ${d.cls} mr-2 tnum">${d.badge}</span>
          <span class="color-fg-muted text-small">${d.note}</span>
        </div>
      </div>
    </div>`).join("");

  // Weekly signups
  const first = weeks[0].signups, last = weeks[weeks.length - 1].signups;
  const max = Math.max(...weeks.map((w) => w.signups));
  const total = weeks.reduce((s, w) => s + w.signups, 0);
  $("signupTotal").textContent = `${int(total)} total`;
  $("signupGrowth").textContent = `+${(((last - first) / first) * 100).toFixed(1)}%`;
  $("signupRows").innerHTML = weeks.map((w, i) => `
    <div class="Box-row signup-row">
      <span class="color-fg-muted">${esc(w.week)}</span>
      <span class="Progress"><span class="Progress-item ${i === weeks.length - 1 ? "color-bg-accent-emphasis" : "color-bg-accent-emphasis"}" style="width:${(w.signups / max) * 100}%"></span></span>
      <span class="text-bold text-right tnum">${int(w.signups)}</span>
    </div>`).join("");

  // Plans
  const planColors = ["color-bg-accent-emphasis", "color-bg-success-emphasis", "color-bg-done-emphasis"];
  $("planTotal").textContent = usd(totalMrr);
  $("planBar").innerHTML = plans.map((p, i) =>
    `<span class="Progress-item ${planColors[i % planColors.length]}" style="width:${(p.mrr_usd / totalMrr) * 100}%"></span>`).join("");
  $("planRows").innerHTML = plans.map((p, i) => `
    <div class="Box-row plan-row">
      <span class="text-bold"><span class="Progress-item ${planColors[i % planColors.length]} d-inline-block circle mr-2" style="width:var(--base-size-8);height:var(--base-size-8)"></span>${esc(p.plan)}</span>
      <span class="text-bold text-right tnum">${usd(p.mrr_usd)}</span>
      <span class="color-fg-muted text-small tnum">${int(p.accounts)} accounts · ${usd2(p.mrr_usd / p.accounts)} per account</span>
      <span class="color-fg-muted text-small text-right tnum">${((p.mrr_usd / totalMrr) * 100).toFixed(1)}% of MRR</span>
    </div>`).join("");

  // Events
  const kind = (t) => {
    t = t.toLowerCase();
    if (t.includes("cancel")) return ["Churn", "Label--danger"];
    if (t.includes("upgrade")) return ["Expansion", "Label--success"];
    if (t.includes("seat")) return ["Seats", "Label--accent"];
    if (t.includes("trial")) return ["Trial", "Label--attention"];
    return ["Event", "Label--secondary"];
  };
  $("events").innerHTML = events.map((e) => {
    const [tag, cls] = kind(e.event);
    return `
    <div class="Box-row d-flex flex-items-center">
      <div class="flex-auto">
        <div class="text-bold">${esc(e.account)}</div>
        <div class="color-fg-muted text-small">${esc(e.event)}</div>
      </div>
      <span class="Label ${cls} mr-2">${tag}</span>
      <span class="color-fg-muted text-small tnum">${esc(e.time)}</span>
    </div>`;
  }).join("");
})();
</script>
</body>
</html>
