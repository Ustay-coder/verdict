# Commit message review: the usual style rules (50-character subject, imperative mood, blank line, wrapped body).
name: Commit message review
version: "1"
description: Is this a good commit message?
context: You review one commit message from an open-source Java project.
judges:
  j: { type: decision, provider: typesafe, model: jev-latest }
defaultJudge: { type: ref, ref: j }
criteria:
  - id: why
    name: Says why
    inputs: [message]
    scale: { type: binary, labels: [no, yes] }
    anchors:
      no: "Nothing in the message, stated or implied, gives a reason for the change and there is no issue or pull request reference"
      yes: "The message gives a reason, in any one of these ways: describes the issue (error scenario, shortcoming, issue report); states the objective or goal; illustrates a requirement (something out of date, environment changed, a usage need); implies necessity (follows a convention, brings an improvement or benefit, relates to an implemented feature or prior commit); or references the issue or pull request the change belongs to"
  - id: what
    name: Says what changed
    inputs: [message]
    scale: { type: binary, labels: [no, yes] }
    anchors:
      no: "The message describes only the problem, symptom or desired outcome and never says which change was made"
      yes: "The message says what was changed, even briefly: naming the object of change and the kind of change (add, remove, update, rename, polish, fix in a named file or component) is enough. A change list, a before/after contrast, what the code now does, or how the change works also count"
aggregation: { method: min, passThreshold: 50 }
