# 상세페이지 심사 (깐깐한 버전): 건강기능식품 상세페이지가 광고 기준과 브랜드 브리프에 맞는가?
# Inputs: -i page=detail.md -i brief=brief.json
# 기준 출처 (조사: 2026-11-07, 2차 자료 포함. 실제 게시 전에는 원문과 자율심의를 확인할 것):
#   - 식품 등의 표시·광고에 관한 법률 제8조: 질병 예방·치료 효능, 의약품 오인, 거짓·과장, 소비자 기만(체험기·후기) 금지
#   - 한국건강기능식품협회 공통심의기준: 인정된 기능성 범위 안에서만 표현, 체험사례는 객관적 사실·직접 관련만
#   - 2026-11-27 시행 개정: 의사·약사·교수 등 전문가(AI로 만든 가상 인물 포함)의 보증·추천 광고 제재
#   - 표시 기준: '건강기능식품' 표기, 기능성·섭취량·섭취방법·주의사항, 의약품이 아니라는 문구
# 질병 치료 표현이 있으면 0점. 게이트를 넘으면 완성도 점수의 1/6에서 시작하고, 나머지 다섯 기준을 하나 지킬 때마다 1/6씩 더 받습니다.
name: 상세페이지 심사 (깐깐)
version: "2"
description: 이 상세페이지를 그대로 스마트스토어에 올려도 되는가?
context: |
  건강기능식품 상세페이지 문구를 광고 기준과 브랜드 브리프에 비추어 엄격하게 심사합니다. 브리프에는 인정된 기능성 문구,
  금지 표현(must_not), 반드시 들어가야 할 정보(required)가 적혀 있습니다. 상세페이지 문구만 판단하고,
  애매하면 위반으로 판단하세요. 각 기준은 그 기준이 말하는 유형의 문장만 봅니다. 다른 유형의 문제가 있어도 그 기준의 판단에 넣지 마세요.
language: ko
scale: { type: numeric, min: 1, max: 5 }
judges:
  jev: { type: decision, provider: typesafe, model: jev-latest }
  clef: { type: decision, provider: cloudflare, model: "@cf/cloudflare/clef" }
defaultJudge: { type: ref, ref: jev }

criteria:
  # 상세페이지로서의 완성도 (점수의 크기)
  - id: empathy
    name: 타깃 고객의 상황에서 시작한다
    weight: 3
    inputs: [page, brief]
    levels:
      - { value: 1, label: 무관, description: "브리프의 타깃과 상관없는 이야기로 시작한다" }
      - { value: 3, label: 일부, description: "타깃을 언급하지만 그들의 구체적인 상황은 없다" }
      - { value: 5, label: 정확, description: "브리프의 타깃이 겪는 구체적인 상황에서 시작한다" }
  - id: specifics
    name: 제품 정보가 구체적이다
    weight: 2
    inputs: [page, brief]
    levels:
      - { value: 1, label: 모호, description: "원료, 섭취법, 용량, 가격 같은 정보가 없다" }
      - { value: 3, label: 일부, description: "일부 정보만 있다" }
      - { value: 5, label: 구체적, description: "원료와 함량, 섭취법, 용량, 가격이 모두 분명하다" }
  - id: trust
    name: 확인할 수 있는 근거가 있다
    weight: 1
    inputs: [page]
    levels:
      - { value: 1, label: 없음, description: "주장만 있고 확인할 근거가 없다" }
      - { value: 3, label: 약함, description: "근거가 하나 있지만 약하다" }
      - { value: 5, label: 분명, description: "원료와 함량, 주의사항, 과장 없는 후기처럼 확인할 수 있는 근거가 있다" }

  # 게이트: 하나라도 있으면 0점
  - id: no_disease
    name: 질병 치료·의약품 오인 없음
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [위반, 준수] }
    anchors: { 위반: "질병(당뇨 등)의 예방·치료·완화 효능을 말하거나, 약을 대신하거나 끊을 수 있다고 하는 등 의약품으로 오인하게 하는 문장이 하나라도 있다", 준수: "질병명을 들어 예방·치료를 말하거나 약을 대신·중단할 수 있다고 하는 문장이 없다 (과장된 효과 표현, 후기, 순위 표현은 다른 기준에서 본다)" }

  # 감점 기준: 하나 지킬 때마다 완성도 점수의 1/6을 더 받는다
  - id: effect_scope
    name: 효과 표현이 인정 문구 안에 있다
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [위반, 준수] }
    anchors: { 위반: "제목이나 본문에 '혈당 걱정 끝', '혈당이 뚝 떨어진다', '효과 100% 보장'처럼 인정 문구(식후 혈당상승 억제에 도움을 줄 수 있음)를 넘어서거나 효과를 단정·보장하는 표현이 있다", 준수: "제품 설명 문구(제목·본문)의 효과 표현이 모두 인정 문구 범위 안에 있고, 단정하거나 보장하지 않는다 (후기와 질병 문장은 다른 기준에서 본다)" }
  - id: honest_reviews
    name: 후기가 효과를 입증하는 것처럼 쓰이지 않았다
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [위반, 준수] }
    anchors: { 위반: "혈당 수치 변화나 '정상이 됐다'처럼 제품 효과가 입증된 것처럼 보이게 하는 후기·체험기가 있다", 준수: "후기가 없거나, 있다면 섭취 습관·복용 편의처럼 효과를 입증하지 않는 객관적 경험만 담았다" }
  - id: no_endorsement
    name: 전문가 추천·보증이 없다
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [위반, 준수] }
    anchors: { 위반: "의사·약사·교수 등 전문가가 제품을 추천하거나 보증하는 문장이 있다", 준수: "전문가가 제품을 추천하거나 보증하는 문장이 없다" }
  - id: no_rank_hype
    name: 순위·인증 과장이 없다
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [위반, 준수] }
    anchors: { 위반: "'판매 1위', '최고', '유일' 같은 순위·최상급 표현이나, 원료 인정을 '식약처 인증 제품'처럼 부풀린 표현이 있다", 준수: "순위·최상급 표현이 없고, 식약처 관련 표현은 '식약처 고시 기능성 원료'처럼 사실 그대로다" }
  - id: required_info
    name: 필수 정보가 모두 있다
    weight: 0
    judge: { type: ref, ref: clef }
    inputs: [page, brief]
    scale: { type: binary, labels: [누락, 완비] }
    anchors: { 누락: "브리프의 required 다섯 가지('건강기능식품' 표기, 인정 기능성 문구, 섭취량·섭취방법, 섭취 시 주의사항, '질병의 예방 및 치료를 위한 의약품이 아닙니다' 문구) 중 하나라도 빠졌다", 완비: "브리프의 required 다섯 가지가 모두 상세페이지에 있다" }

aggregation:
  method: formula
  formula: "no_disease_n < 0.5 ? 0 : (empathy_n * 3 + specifics_n * 2 + trust_n) / 6 * (1 + effect_scope_n + honest_reviews_n + no_endorsement_n + no_rank_hype_n + required_info_n) / 6"
  normalize: [0, 100]
  precision: 0
  gates:
    - { criterion: no_disease, min: 1, message: "질병 치료·의약품 오인 표현이 있습니다 (식품표시광고법 제8조)" }
  grades: [{ label: 게시 가능, min: 90 }, { label: 수정 필요, min: 60 }, { label: 반려, min: 0 }]
  passThreshold: 90
