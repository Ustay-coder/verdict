# Probe for rubric v2 (see ../PRINCIPLES.md): five principle-based criteria. Evaluate with -i ui=<url> --screenshot -i data=start/data.json
name: Dashboard principles probe
context: |
  You are a senior product designer who reviews dashboards against established principles (Stephen Few, Tufte,
  Cleveland & McGill, NN/g, Refactoring UI) and who can recognise AI-generated defaults, both first-order
  (purple gradients, glass, glows) and second-order "tasteful" ones (cream + terracotta, tracked all-caps eyebrows,
  one accented headline word, uniform icon/KPI card rows, donut charts as decoration).
scale: { type: numeric, min: 1, max: 5 }
judges:
  jev:  { type: decision, provider: typesafe, model: jev-latest }
  clef: { type: decision, provider: cloudflare, model: "@cf/cloudflare/clef" }
defaultJudge: { type: ref, ref: clef }
criteria:
  - id: defaults
    name: Free of AI defaults (first and second order)
    inputs: [ui]
    levels:
      - { value: 1, label: first_order, description: "Purple/blue gradients, glass cards, glows, gradient text" }
      - { value: 2, label: second_order, description: "Tasteful AI default: cream or off-white with a single terracotta/orange accent, tracked all-caps labels, one accented headline word, a row of identical KPI cards, a decorative donut" }
      - { value: 4, label: mostly_own, description: "A few default habits remain, but the look follows from the content" }
      - { value: 5, label: own, description: "No recognisable template habits; every visual choice is explained by the data and its users" }
  - id: chart_fit
    name: Charts use position and length
    inputs: [ui]
    levels:
      - { value: 1, label: angle_area, description: "Key comparisons rely on angle or area (pie/donut, gauges, bubbles) or decorative charts" }
      - { value: 3, label: mixed, description: "Some position/length charts, but at least one comparison uses a donut, pie or gauge" }
      - { value: 5, label: position, description: "Every comparison uses aligned bars, lines or tables, directly labelled" }
  - id: color_signal
    name: Color is a signal, not decoration
    inputs: [ui]
    levels:
      - { value: 1, label: decorative, description: "Color is spread everywhere for decoration; it carries no meaning" }
      - { value: 3, label: partial, description: "Mostly restrained, but the accent decorates as often as it signals" }
      - { value: 5, label: signal, description: "The page works in grayscale; color appears only to flag what needs attention or status" }
  - id: questions
    name: Answers the operator's questions
    judge: { type: ref, ref: jev }
    inputs: [ui, data]
    levels:
      - { value: 1, label: inventory, description: "An inventory of every number in the data, with no point of view" }
      - { value: 3, label: partial, description: "Shows what changed, but not whether it is good or bad or what needs attention" }
      - { value: 5, label: answers, description: "Says at once what changed, whether that is on track, and what needs attention (e.g. a cancellation), in that order" }
  - id: redundancy
    name: Each figure shown once, with context
    judge: { type: ref, ref: jev }
    inputs: [ui, data]
    levels:
      - { value: 1, label: repeated, description: "The same figure appears three or more times, or breakdowns are duplicated in several charts" }
      - { value: 3, label: some, description: "Minor repetition; some figures lack a comparison" }
      - { value: 5, label: once, description: "Every figure appears once, next to its comparison (previous period, trend or target)" }
aggregation: { method: mean, normalize: [0, 100], precision: 0 }
