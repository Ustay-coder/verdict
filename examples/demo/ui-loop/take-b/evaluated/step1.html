<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Pulse — Analytics · October 2026</title>
<style>
  :root {
    --bg: #07080f;
    --panel: rgba(255,255,255,0.035);
    --panel-border: rgba(255,255,255,0.08);
    --text: #eef0ff;
    --muted: #8b8fb3;
    --dim: #5a5e80;
    --violet: #8b5cf6;
    --pink: #ec4899;
    --cyan: #22d3ee;
    --lime: #a3e635;
    --amber: #fbbf24;
    --rose: #fb7185;
    --green: #34d399;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 28px 28px 60px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 34px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: var(--violet);
    position: relative;
  }
  .logo::after { content: ""; position: absolute; inset: 3px; border-radius: 11px; background: #0d0e1a; }
  .logo svg { position: relative; z-index: 1; }
  .brand h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  .brand p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 550;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
  }
  .pill.sample { color: var(--amber); border-color: rgba(251,191,36,.25); background: rgba(251,191,36,.07); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 80%,100% { box-shadow: 0 0 0 9px rgba(52,211,153,0); } }

  /* Hero headline */
  .hero { margin-bottom: 26px; }
  .hero h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
  .grad-text {
    color: #c4b5fd;
    animation: shimmer 8s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .hero p { color: var(--muted); margin-top: 10px; font-size: 15px; max-width: 680px; line-height: 1.55; }

  /* Cards */
  .card {
    position: relative; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius); padding: 22px;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s;
    opacity: 0; transform: translateY(14px);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card:hover { border-color: rgba(255,255,255,0.16); }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .card-head h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; }

  /* KPI grid */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 18px; }
  .kpi { overflow: hidden; }
  .kpi:hover { transform: translateY(-4px); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi-icon {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
  }
  .kpi-value { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; margin: 18px 0 10px; font-variant-numeric: tabular-nums; }
  .kpi-value small { font-size: 20px; font-weight: 700; color: var(--muted); margin-left: 2px; }
  .kpi-foot { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .delta {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
    font-weight: 700; font-size: 12.5px;
  }
  .delta.up { color: var(--green); background: rgba(52,211,153,.12); }
  .delta.neutral { color: var(--muted); background: rgba(255,255,255,.06); }
  .meter { height: 6px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 4px; width: 100%; }
  .meter > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 1.4s cubic-bezier(.2,.8,.2,1); }

  /* Main grid */
  .main { display: grid; grid-template-columns: 1.65fr 1fr; gap: 18px; margin-bottom: 18px; }
  .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  /* Signups chart */
  .chart-stats { display: flex; gap: 22px; text-align: right; }
  .chart-stats b { display: block; font-size: 20px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .chart-stats span { font-size: 12px; color: var(--muted); }
  .chart-box { position: relative; width: 100%; height: 300px; }
  .chart-box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .tooltip {
    position: absolute; pointer-events: none; padding: 10px 13px; border-radius: 12px;
    background: rgba(15,16,30,.92); border: 1px solid rgba(255,255,255,.12);
    font-size: 12.5px; white-space: nowrap; transform: translate(-50%, -115%);
    opacity: 0; transition: opacity .15s;
  }
  .tooltip b { font-size: 16px; display: block; margin-top: 2px; }
  .tooltip .tchg { font-size: 11.5px; font-weight: 650; }

  /* Donut */
  .donut-wrap { display: flex; align-items: center; justify-content: center; position: relative; margin: 4px 0 20px; }
  .donut-wrap svg { width: 220px; height: 220px; transform: rotate(-90deg); overflow: visible; }
  .donut-center { position: absolute; text-align: center; pointer-events: none; }
  .donut-center .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .donut-center .val { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .donut-center .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seg { transition: stroke-width .25s, opacity .25s; cursor: pointer; }
  .legend { display: grid; gap: 10px; }
  .legend-row {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px; transition: background .2s; cursor: default;
  }
  .legend-row:hover, .legend-row.active { background: rgba(255,255,255,.05); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .legend-row .name { font-weight: 600; font-size: 14px; }
  .legend-row .amt { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .legend-row .pct { font-size: 12px; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  /* Plan table */
  .plan-list { display: grid; gap: 18px; }
  .plan-row .row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
  .plan-row .pname { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .plan-row .pmeta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .plan-row .pmeta b { color: var(--text); font-weight: 700; }
  .bar-track { height: 10px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: inherit; transition: width 1.3s cubic-bezier(.2,.8,.2,1); position: relative; }
  .bar-fill::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); animation: sheen 3.2s ease-in-out infinite 1.5s; }
  @keyframes sheen { 60%,100% { transform: translateX(100%); } }
  .arpa-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
  .arpa { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
  .arpa span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .arpa b { display: block; font-size: 19px; font-weight: 750; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .arpa em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; }

  /* Events */
  .timeline { list-style: none; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 19px; top: 10px; bottom: 10px; width: 2px; background: var(--panel-border); }
  .event { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 10px 0; position: relative; opacity: 0; transform: translateX(-10px); animation: slide .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  .ev-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; position: relative; z-index: 1; border: 1px solid rgba(255,255,255,.08); background: #0f1020; }
  .ev-icon::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--c); opacity: .16; }
  .ev-icon svg { color: var(--c); position: relative; }
  .ev-body { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.05); transition: background .2s, border-color .2s; }
  .ev-body:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); }
  .ev-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ev-acct { font-weight: 650; font-size: 14.5px; }
  .ev-time { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ev-text { font-size: 13.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }

  footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 12.5px; }

  /* Responsive */
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .main, .bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 20px 16px 40px; }
    .kpis { grid-template-columns: 1fr; }
    .chart-stats { display: none; }
    .arpa-strip { grid-template-columns: 1fr; }
    .chart-box { height: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h4l3-8 4 16 3-8h6"/>
        </svg>
      </div>
      <div>
        <h1 id="product">Acme Pulse</h1>
        <p>Revenue &amp; growth analytics</p>
      </div>
    </div>
    <div class="header-right">
      <span class="pill sample" id="note" title="">Sample data</span>
      <span class="pill"><span class="live-dot"></span><span id="period">October 2026</span></span>
    </div>
  </header>

  <section class="hero">
    <h2>MRR hit <span class="grad-text" id="heroMrr">$48.2k</span> this month</h2>
    <p id="heroSub"></p>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="main">
    <div class="card" style="animation-delay:.35s">
      <div class="card-head">
        <div>
          <div class="card-title">Acquisition</div>
          <h3>Weekly signups</h3>
        </div>
        <div class="chart-stats" id="chartStats"></div>
      </div>
      <div class="chart-box" id="chartBox">
        <svg id="chart" role="img" aria-label="Weekly signups line chart"></svg>
        <div class="tooltip" id="tip"></div>
      </div>
    </div>

    <div class="card" style="animation-delay:.45s">
      <div class="card-head">
        <div>
          <div class="card-title">Revenue mix</div>
          <h3>MRR by plan</h3>
        </div>
      </div>
      <div class="donut-wrap">
        <svg id="donut" viewBox="0 0 220 220" role="img" aria-label="MRR share by plan"></svg>
        <div class="donut-center">
          <div class="lbl" id="dLbl">Total MRR</div>
          <div class="val" id="dVal">$48,200</div>
          <div class="sub" id="dSub">3 plans</div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="bottom">
    <div class="card" style="animation-delay:.55s">
      <div class="card-head">
        <div>
          <div class="card-title">Customer base</div>
          <h3>Accounts by plan</h3>
        </div>
      </div>
      <div class="plan-list" id="planList"></div>
      <div class="arpa-strip" id="arpa"></div>
    </div>

    <div class="card" style="animation-delay:.65s">
      <div class="card-head">
        <div>
          <div class="card-title">Activity</div>
          <h3>Recent account events</h3>
        </div>
      </div>
      <ul class="timeline" id="events"></ul>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
/* Data — embedded verbatim from data.json so the page works offline / from file:// */
const DATA = {
  "product": "Acme Pulse",
  "note": "Fictional sample data for a demo.",
  "period": "October 2026",
  "kpis": {
    "mrr_usd": 48200,
    "mrr_change_pct": 4.1,
    "active_accounts": 1284,
    "active_accounts_change": 37,
    "churn_rate_pct": 2.3,
    "trial_to_paid_pct": 18.6
  },
  "weekly_signups": [
    { "week": "Sep 8", "signups": 212 },
    { "week": "Sep 15", "signups": 198 },
    { "week": "Sep 22", "signups": 231 },
    { "week": "Sep 29", "signups": 244 },
    { "week": "Oct 6", "signups": 227 },
    { "week": "Oct 13", "signups": 259 },
    { "week": "Oct 20", "signups": 268 },
    { "week": "Oct 27", "signups": 281 }
  ],
  "plans": [
    { "plan": "Starter", "accounts": 702, "mrr_usd": 13860 },
    { "plan": "Team", "accounts": 498, "mrr_usd": 24900 },
    { "plan": "Business", "accounts": 84, "mrr_usd": 9440 }
  ],
  "recent_events": [
    { "time": "Nov 4, 16:12", "account": "Northfield Labs", "event": "Upgraded Starter → Team" },
    { "time": "Nov 4, 11:40", "account": "Kettle & Co", "event": "Started trial" },
    { "time": "Nov 3, 09:05", "account": "Bramble Studio", "event": "Cancelled (reason: budget)" },
    { "time": "Nov 2, 18:27", "account": "Osprey Freight", "event": "Added 12 seats" }
  ]
};

(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmtInt = n => n.toLocaleString("en-US");
  const fmtUsd = n => "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  const fmtUsd2 = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const el = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const PLAN_COLORS = ["#22d3ee", "#8b5cf6", "#ec4899"];

  function countUp(node, to, { decimals = 0, prefix = "", suffix = "", duration = 1400 } = {}) {
    const render = v => node.innerHTML = prefix + v.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;
    if (reduced) return render(to);
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / duration);
      const e = 1 - Math.pow(1 - p, 4);
      render(to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const k = DATA.kpis;
  const plans = DATA.plans;
  const weeks = DATA.weekly_signups;
  const totalAccounts = plans.reduce((s, p) => s + p.accounts, 0);
  const totalPlanMrr = plans.reduce((s, p) => s + p.mrr_usd, 0);

  /* Header */
  $("product").textContent = DATA.product;
  $("period").textContent = DATA.period;
  $("note").textContent = "Sample data";
  $("note").title = DATA.note;
  document.title = `${DATA.product} — Analytics · ${DATA.period}`;
  $("footer").textContent = `${DATA.product} · ${DATA.period} · ${DATA.note}`;

  /* Hero */
  $("heroMrr").textContent = "$" + (k.mrr_usd / 1000).toFixed(1) + "k";
  const firstW = weeks[0].signups, lastW = weeks[weeks.length - 1].signups;
  $("heroSub").innerHTML =
    `Up <b style="color:var(--green)">${k.mrr_change_pct}%</b> month over month with ` +
    `<b style="color:var(--text)">${fmtInt(k.active_accounts)}</b> active accounts. ` +
    `Weekly signups climbed from ${firstW} to ${lastW} over the last ${weeks.length} weeks.`;

  /* KPI cards */
  const icons = {
    mrr: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    users: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    churn: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg>',
    conv: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>'
  };
  const up = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';

  const kpiDefs = [
    { label: "Monthly recurring revenue", icon: icons.mrr, accent: "#8b5cf6", value: k.mrr_usd, prefix: "$",
      foot: `<span class="delta up">${up}${k.mrr_change_pct}%</span> vs last month` },
    { label: "Active accounts", icon: icons.users, accent: "#22d3ee", value: k.active_accounts,
      foot: `<span class="delta up">${up}+${k.active_accounts_change}</span> net new this month` },
    { label: "Churn rate", icon: icons.churn, accent: "#fb7185", value: k.churn_rate_pct, decimals: 1, suffix: "<small>%</small>",
      foot: `<span class="delta neutral">monthly</span> share of accounts lost`, meter: k.churn_rate_pct },
    { label: "Trial → paid", icon: icons.conv, accent: "#a3e635", value: k.trial_to_paid_pct, decimals: 1, suffix: "<small>%</small>",
      foot: `<span class="delta neutral">conversion</span> of trials to paid plans`, meter: k.trial_to_paid_pct }
  ];
  kpiDefs.forEach((d, i) => {
    const c = document.createElement("div");
    c.className = "card kpi";
    c.style.setProperty("--accent", d.accent);
    c.style.animationDelay = (0.05 + i * 0.08) + "s";
    c.innerHTML = `
      <div class="kpi-top"><span class="card-title">${d.label}</span><span class="kpi-icon">${d.icon}</span></div>
      <div class="kpi-value">0</div>
      <div class="kpi-foot">${d.foot}</div>
      ${d.meter != null ? `<div class="meter" title="${d.meter}% of 100%"><i data-w="${d.meter}"></i></div>` : ""}`;
    $("kpis").appendChild(c);
    countUp(c.querySelector(".kpi-value"), d.value, { decimals: d.decimals || 0, prefix: d.prefix || "", suffix: d.suffix || "" });
  });

  /* Signups chart */
  const total = weeks.reduce((s, w) => s + w.signups, 0);
  const growth = ((lastW - firstW) / firstW) * 100;
  $("chartStats").innerHTML = `
    <div><b>${fmtInt(total)}</b><span>Total, ${weeks.length} wks</span></div>
    <div><b style="color:var(--green)">+${growth.toFixed(1)}%</b><span>${weeks[0].week} → ${weeks[weeks.length-1].week}</span></div>`;

  const svg = $("chart"), box = $("chartBox"), tip = $("tip");
  function drawChart() {
    svg.innerHTML = "";
    const W = box.clientWidth, H = box.clientHeight;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const pad = { l: 38, r: 14, t: 16, b: 30 };
    const vals = weeks.map(w => w.signups);
    const yMin = Math.floor((Math.min(...vals) - 30) / 50) * 50;
    const yMax = Math.ceil((Math.max(...vals) + 20) / 50) * 50;
    const x = i => pad.l + (i * (W - pad.l - pad.r)) / (weeks.length - 1);
    const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (H - pad.t - pad.b);

    // Gridlines + y labels
    for (let v = yMin; v <= yMax; v += 50) {
      svg.appendChild(el("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: "rgba(255,255,255,.06)", "stroke-dasharray": "3 5" }));
      const t = el("text", { x: pad.l - 10, y: y(v) + 4, "text-anchor": "end", fill: "#5a5e80", "font-size": 11 });
      t.textContent = v; svg.appendChild(t);
    }
    // X labels
    weeks.forEach((w, i) => {
      const t = el("text", { x: x(i), y: H - 8, "text-anchor": "middle", fill: "#5a5e80", "font-size": 11 });
      t.textContent = w.week; svg.appendChild(t);
    });

    // Smooth path (monotone-ish cardinal)
    const pts = weeks.map((w, i) => [x(i), y(w.signups)]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const t = 0.18;
      d += ` C${p1[0] + (p2[0] - p0[0]) * t},${p1[1] + (p2[1] - p0[1]) * t} ${p2[0] - (p3[0] - p1[0]) * t},${p2[1] - (p3[1] - p1[1]) * t} ${p2[0]},${p2[1]}`;
    }
    const area = el("path", { d: `${d} L${pts.at(-1)[0]},${H - pad.b} L${pts[0][0]},${H - pad.b} Z`, fill: "#8b5cf6", "fill-opacity": 0.12 });
    svg.appendChild(area);
    const line = el("path", { d, fill: "none", stroke: "#8b5cf6", "stroke-width": 3.2, "stroke-linecap": "round" });
    svg.appendChild(line);

    if (!reduced && !drawChart.done) {
      const len = line.getTotalLength();
      line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
      line.getBoundingClientRect();
      line.style.transition = "stroke-dashoffset 1.8s cubic-bezier(.65,0,.35,1) .5s";
      line.style.strokeDashoffset = 0;
      area.style.opacity = 0; area.style.transition = "opacity 1.2s ease 1.4s";
      requestAnimationFrame(() => requestAnimationFrame(() => area.style.opacity = 1));
      line.addEventListener("transitionend", () => { line.style.strokeDasharray = "none"; }, { once: true });
      drawChart.done = true;
    }

    // Hover elements
    const guide = el("line", { y1: pad.t, y2: H - pad.b, stroke: "rgba(255,255,255,.18)", "stroke-dasharray": "4 4", opacity: 0 });
    svg.appendChild(guide);
    const dots = pts.map((p, i) => {
      const g = el("circle", { cx: p[0], cy: p[1], r: i === pts.length - 1 ? 5.5 : 3.5, fill: "#0d0e1a", stroke: i === pts.length - 1 ? "#ec4899" : "#a78bfa", "stroke-width": 2.5 });
      svg.appendChild(g); return g;
    });
    // pulse ring on latest point
    const ring = el("circle", { cx: pts.at(-1)[0], cy: pts.at(-1)[1], r: 6, fill: "none", stroke: "#ec4899", "stroke-width": 2 });
    if (!reduced) ring.innerHTML = `<animate attributeName="r" from="6" to="18" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from=".8" to="0" dur="2s" repeatCount="indefinite"/>`;
    else ring.setAttribute("opacity", 0);
    svg.insertBefore(ring, dots[0]);

    const hit = el("rect", { x: pad.l - 10, y: 0, width: W - pad.l - pad.r + 20, height: H, fill: "transparent" });
    svg.appendChild(hit);
    const show = clientX => {
      const r = svg.getBoundingClientRect();
      const mx = clientX - r.left;
      let i = 0, best = Infinity;
      pts.forEach((p, j) => { const dd = Math.abs(p[0] - mx); if (dd < best) { best = dd; i = j; } });
      guide.setAttribute("x1", pts[i][0]); guide.setAttribute("x2", pts[i][0]); guide.setAttribute("opacity", 1);
      dots.forEach((dt, j) => dt.setAttribute("r", j === i ? 6.5 : (j === pts.length - 1 ? 5.5 : 3.5)));
      const prev = i > 0 ? weeks[i - 1].signups : null;
      const chg = prev != null ? ((weeks[i].signups - prev) / prev) * 100 : null;
      tip.innerHTML = `<span style="color:var(--muted)">Week of ${esc(weeks[i].week)}</span><b>${fmtInt(weeks[i].signups)} signups</b>` +
        (chg != null ? `<span class="tchg" style="color:${chg >= 0 ? "var(--green)" : "var(--rose)"}">${chg >= 0 ? "▲" : "▼"} ${Math.abs(chg).toFixed(1)}% WoW</span>` : `<span class="tchg" style="color:var(--muted)">first week shown</span>`);
      tip.style.left = Math.min(Math.max(pts[i][0], 70), W - 70) + "px";
      tip.style.top = pts[i][1] + "px";
      tip.style.opacity = 1;
    };
    const hide = () => { tip.style.opacity = 0; guide.setAttribute("opacity", 0); dots.forEach((dt, j) => dt.setAttribute("r", j === pts.length - 1 ? 5.5 : 3.5)); };
    hit.addEventListener("mousemove", e => show(e.clientX));
    hit.addEventListener("touchstart", e => show(e.touches[0].clientX), { passive: true });
    hit.addEventListener("touchmove", e => show(e.touches[0].clientX), { passive: true });
    hit.addEventListener("mouseleave", hide);
    hit.addEventListener("touchend", () => setTimeout(hide, 1200));
  }
  drawChart();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });

  /* Donut */
  const donut = $("donut");
  const R = 88, C = 2 * Math.PI * R, GAP = 4;
  donut.appendChild(el("circle", { cx: 110, cy: 110, r: R, fill: "none", stroke: "rgba(255,255,255,.05)", "stroke-width": 22 }));
  let acc = 0;
  const segs = plans.map((p, i) => {
    const frac = p.mrr_usd / totalPlanMrr;
    const len = Math.max(0, frac * C - GAP);
    const s = el("circle", {
      class: "seg", cx: 110, cy: 110, r: R, fill: "none", stroke: PLAN_COLORS[i], "stroke-width": 22,
      "stroke-linecap": "butt", "stroke-dasharray": `0 ${C}`, "stroke-dashoffset": -acc
    });
    const target = `${len} ${C - len}`;
    if (reduced) s.setAttribute("stroke-dasharray", target);
    else {
      s.style.transition = `stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1) ${0.6 + i * 0.18}s, stroke-width .25s, opacity .25s`;
      requestAnimationFrame(() => requestAnimationFrame(() => s.setAttribute("stroke-dasharray", target)));
    }
    acc += frac * C;
    donut.appendChild(s);
    return s;
  });
  const setCenter = i => {
    if (i == null) {
      $("dLbl").textContent = "Total MRR"; $("dVal").textContent = fmtUsd(totalPlanMrr); $("dSub").textContent = `${plans.length} plans`;
      segs.forEach(s => { s.style.opacity = 1; s.setAttribute("stroke-width", 22); });
      document.querySelectorAll(".legend-row").forEach(r => r.classList.remove("active"));
      return;
    }
    const p = plans[i];
    $("dLbl").textContent = p.plan; $("dVal").textContent = fmtUsd(p.mrr_usd);
    $("dSub").textContent = `${((p.mrr_usd / totalPlanMrr) * 100).toFixed(1)}% of MRR`;
    segs.forEach((s, j) => { s.style.opacity = j === i ? 1 : .3; s.setAttribute("stroke-width", j === i ? 28 : 22); });
    document.querySelectorAll(".legend-row").forEach((r, j) => r.classList.toggle("active", j === i));
  };
  plans.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="swatch" style="background:${PLAN_COLORS[i]}"></span>
      <span class="name">${esc(p.plan)}</span><span class="amt">${fmtUsd(p.mrr_usd)}</span>
      <span class="pct">${((p.mrr_usd / totalPlanMrr) * 100).toFixed(1)}%</span>`;
    row.addEventListener("mouseenter", () => setCenter(i));
    row.addEventListener("mouseleave", () => setCenter(null));
    segs[i].addEventListener("mouseenter", () => setCenter(i));
    segs[i].addEventListener("mouseleave", () => setCenter(null));
    $("legend").appendChild(row);
  });
  setCenter(null);

  /* Accounts by plan */
  const maxAcc = Math.max(...plans.map(p => p.accounts));
  plans.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "plan-row";
    const share = (p.accounts / totalAccounts) * 100;
    row.innerHTML = `
      <div class="row-top">
        <span class="pname"><span class="swatch" style="background:${PLAN_COLORS[i]}"></span>${esc(p.plan)}</span>
        <span class="pmeta"><b>${fmtInt(p.accounts)}</b> accounts · ${share.toFixed(1)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" data-w="${(p.accounts / maxAcc) * 100}" style="background:${PLAN_COLORS[i]}"></div></div>`;
    $("planList").appendChild(row);
  });
  $("arpa").innerHTML = plans.map((p, i) =>
    `<div class="arpa"><span>${esc(p.plan)} ARPA</span><b style="color:${PLAN_COLORS[i]}">${fmtUsd2(p.mrr_usd / p.accounts)}<em> /mo</em></b></div>`
  ).join("");

  /* Events */
  const evStyle = text => {
    const t = text.toLowerCase();
    if (t.includes("cancel")) return { c: "#fb7185", tag: "Churn", icon: '<path d="M18 6L6 18M6 6l12 12"/>' };
    if (t.includes("upgrade")) return { c: "#a78bfa", tag: "Expansion", icon: '<path d="M12 19V5M5 12l7-7 7 7"/>' };
    if (t.includes("seat")) return { c: "#34d399", tag: "Seats", icon: '<path d="M12 5v14M5 12h14"/>' };
    if (t.includes("trial")) return { c: "#fbbf24", tag: "Trial", icon: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' };
    return { c: "#22d3ee", tag: "Event", icon: '<circle cx="12" cy="12" r="4"/>' };
  };
  DATA.recent_events.forEach((e, i) => {
    const s = evStyle(e.event);
    const li = document.createElement("li");
    li.className = "event";
    li.style.animationDelay = (0.8 + i * 0.12) + "s";
    li.style.setProperty("--c", s.c);
    li.innerHTML = `
      <div class="ev-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></div>
      <div class="ev-body">
        <div class="ev-top"><span class="ev-acct">${esc(e.account)}</span><span class="ev-time">${esc(e.time)}</span></div>
        <div class="ev-text"><span class="tag">${s.tag}</span>${esc(e.event)}</div>
      </div>`;
    $("events").appendChild(li);
  });

  /* Kick off bar/meter fills */
  setTimeout(() => {
    document.querySelectorAll("[data-w]").forEach(n => n.style.width = n.dataset.w + "%");
  }, reduced ? 0 : 600);
})();
</script>
</body>
</html>
