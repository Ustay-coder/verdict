<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Pulse · October 2026</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #595959;
    --rule: #d6d6d6;
    --bar: #8c8c8c;
    --alert: #b3261e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; color: var(--ink); }
  body {
    font-family: Carlito, "Liberation Sans", sans-serif;
    font-size: 14px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .page { max-width: 1216px; margin: 0 auto; padding: 20px 32px 24px; }

  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header h1 span { font-weight: 400; }
  header p { color: var(--muted); }
  .status { font-size: 18px; padding: 14px 0 0; }

  .grid { display: grid; grid-template-columns: 7fr 5fr; column-gap: 48px; }
  section { padding-top: 18px; }
  h2 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--muted); }

  /* Revenue */
  .lead { display: flex; align-items: baseline; gap: 16px; }
  .lead .fig { font-family: "Bitstream Charter", "Liberation Serif", serif; font-size: 44px; line-height: 1.05; }
  .lead .chg { font-size: 18px; }
  .pairs { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; column-gap: 40px; margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 10px; }
  .pairs dt { color: var(--muted); }
  .pairs dd { font-size: 18px; }
  .pairs dd small { font-size: 14px; color: var(--muted); }

  /* Attention */
  .attention h2 { color: var(--alert); }
  .alert-item { border-top: 2px solid var(--alert); padding-top: 8px; }
  .alert-item b { font-size: 18px; color: var(--alert); }
  .others { margin-top: 14px; }
  .others table { width: 100%; border-collapse: collapse; color: var(--muted); }
  .others td { padding: 3px 0; border-top: 1px solid var(--rule); vertical-align: baseline; }
  .others td.t { white-space: nowrap; padding-right: 16px; width: 1%; }
  .others td.a { color: var(--ink); padding-right: 12px; white-space: nowrap; width: 1%; }

  /* Signups chart */
  .chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
  .chart text { font-family: inherit; font-size: 12px; fill: var(--muted); }
  .chart text.v { fill: var(--ink); }
  .chart text.v.last { font-weight: 700; }

  /* Plans */
  table.plans { width: 100%; border-collapse: collapse; }
  table.plans th { font-weight: 400; color: var(--muted); text-align: right; padding: 4px 0 4px 14px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  table.plans th:first-child, table.plans td:first-child { text-align: left; padding-left: 0; }
  table.plans td { text-align: right; padding: 7px 0 7px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  table.plans td.share { width: 42%; }
  .share-cell { display: flex; align-items: center; gap: 8px; }
  .share-cell i { display: block; height: 10px; background: var(--bar); }
  .share-cell span { width: 44px; text-align: right; flex: none; }
  .foot { color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <p id="note"></p>
  </header>
  <p class="status" id="status"></p>

  <div class="grid">
    <section class="revenue" aria-labelledby="h-rev">
      <h2 id="h-rev">Monthly recurring revenue</h2>
      <div class="lead"><span class="fig" id="mrr"></span><span class="chg" id="mrrChg"></span></div>
      <dl class="pairs" id="pairs"></dl>
    </section>

    <section class="attention" aria-labelledby="h-att">
      <h2 id="h-att"></h2>
      <div id="alerts"></div>
      <div class="others">
        <h2>Other account events</h2>
        <table><tbody id="others"></tbody></table>
      </div>
    </section>

    <section class="chart" aria-labelledby="h-sig">
      <h2 id="h-sig">Weekly signups</h2>
      <p class="sub" id="sigSub"></p>
      <svg id="chart" role="img" aria-label="Weekly signups"></svg>
    </section>

    <section aria-labelledby="h-plan">
      <h2 id="h-plan">Plans, October</h2>
      <table class="plans">
        <thead><tr><th>Plan</th><th>Accounts</th><th>MRR</th><th>Share of MRR</th><th>MRR per account</th></tr></thead>
        <tbody id="plans"></tbody>
      </table>
    </section>
  </div>
</div>

<script>
(async () => {
  const D = await (await fetch("data.json", { cache: "no-store" })).json();
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const int = n => Math.round(n).toLocaleString("en-US");
  const usd = n => "$" + int(n);
  const pct1 = n => n.toFixed(1) + "%";
  const signed = (n, f) => (n > 0 ? "+" : n < 0 ? "−" : "") + f(Math.abs(n));
  const k = D.kpis;

  // Previous month name, derived from the period ("October 2026" -> "September")
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const [monthName] = D.period.split(" ");
  const prevMonth = months[(months.indexOf(monthName) + 11) % 12];
  const monthAbbr = m => m.slice(0, 3);

  document.title = `${D.product} · ${D.period}`;
  $("title").innerHTML = `${esc(D.product)} <span>· ${esc(D.period)}</span>`;
  $("note").textContent = D.note;

  // Weekly signups: split by month of the week label
  const W = D.weekly_signups;
  const cur = W.filter(w => w.week.startsWith(monthAbbr(monthName)));
  const prev = W.filter(w => w.week.startsWith(monthAbbr(prevMonth)));
  const sum = a => a.reduce((s, w) => s + w.signups, 0);
  const curSum = sum(cur), prevSum = sum(prev);
  const sigChg = (curSum - prevSum) / prevSum * 100;
  const last = W[W.length - 1], before = W[W.length - 2];
  const isHigh = last.signups === Math.max(...W.map(w => w.signups));

  // Needs-attention rules from BRIEF.md
  const cancels = D.recent_events.filter(e => /cancelled/i.test(e.event));
  const routine = D.recent_events.filter(e => !/cancelled/i.test(e.event));
  const flags = [];
  cancels.forEach(e => {
    const m = e.event.match(/reason:\s*([^)]+)/i);
    flags.push(`<div class="alert-item"><b>${esc(e.account)} cancelled</b><br><span class="sub">${esc(e.time)}${m ? " · reason: " + esc(m[1]) : ""}</span></div>`);
  });
  if (last.signups < before.signups) flags.push(`<div class="alert-item"><b>Signups fell in the week of ${esc(last.week)}</b></div>`);
  if (k.mrr_change_pct < 0) flags.push(`<div class="alert-item"><b>MRR fell ${pct1(-k.mrr_change_pct)}</b></div>`);
  if (k.active_accounts_change < 0) flags.push(`<div class="alert-item"><b>${int(-k.active_accounts_change)} fewer active accounts</b></div>`);

  // Status line
  const parts = [];
  parts.push(k.mrr_change_pct >= 0 ? "Revenue and accounts grew" : "Revenue fell");
  parts.push(isHigh ? `signups reached an ${W.length}-week high` : `signups ${last.signups >= before.signups ? "rose" : "fell"} in the latest week`);
  const c = cancels.length;
  parts.push(c === 0 ? "no cancellations" : c === 1 ? "one cancellation" : `${c} cancellations`);
  $("status").textContent = parts.join("; ") + ".";

  // Revenue
  $("mrr").textContent = usd(k.mrr_usd);
  $("mrrChg").textContent = `${signed(k.mrr_change_pct, pct1)} vs ${prevMonth}`;
  $("pairs").innerHTML = [
    ["Active accounts", int(k.active_accounts), `${signed(k.active_accounts_change, int)} vs ${prevMonth}`],
    ["Churn rate", pct1(k.churn_rate_pct), `no ${prevMonth} figure`],
    ["Trial to paid", pct1(k.trial_to_paid_pct), `no ${prevMonth} figure`]
  ].map(([l, v, s]) => `<div><dt>${l}</dt><dd>${v} <small>${s}</small></dd></div>`).join("");

  // Attention
  $("h-att").textContent = flags.length ? "Needs attention" : "Nothing needs attention";
  $("alerts").innerHTML = flags.join("");
  $("others").innerHTML = routine.map(e =>
    `<tr><td class="t">${esc(e.time)}</td><td class="a">${esc(e.account)}</td><td>${esc(e.event)}</td></tr>`).join("");

  // Signups chart
  $("sigSub").textContent = `${monthName} weeks ${int(curSum)}, ${prevMonth} weeks ${int(prevSum)} (${signed(sigChg, pct1)})`;
  const svg = $("chart"), NS = "http://www.w3.org/2000/svg";
  const draw = () => {
    svg.innerHTML = "";
    const w = svg.clientWidth, h = svg.clientHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const pad = { l: 14, r: 14, t: 22, b: 40 };
    const vals = W.map(x => x.signups);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const range = hi - lo;
    const yMin = lo - range * 0.6, yMax = hi;
    const x = i => pad.l + i * (w - pad.l - pad.r) / (W.length - 1);
    const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);
    const add = (tag, attrs, text) => {
      const e = document.createElementNS(NS, tag);
      for (const a in attrs) e.setAttribute(a, attrs[a]);
      if (text != null) e.textContent = text;
      svg.appendChild(e); return e;
    };
    // Month spans under the axis
    [[prev, prevMonth], [cur, monthName]].forEach(([arr, name]) => {
      if (!arr.length) return;
      const i0 = W.indexOf(arr[0]), i1 = W.indexOf(arr[arr.length - 1]);
      add("line", { x1: x(i0), x2: x(i1), y1: h - 14, y2: h - 14, stroke: "#bfbfbf", "stroke-width": 1 });
      add("text", { x: (x(i0) + x(i1)) / 2, y: h - 1, "text-anchor": "middle" }, name);
    });
    add("polyline", { points: W.map((d, i) => `${x(i)},${y(d.signups)}`).join(" "), fill: "none", stroke: "#1a1a1a", "stroke-width": 2, "stroke-linejoin": "round" });
    W.forEach((d, i) => {
      const isLast = i === W.length - 1;
      add("circle", { cx: x(i), cy: y(d.signups), r: isLast ? 4 : 2.5, fill: "#1a1a1a" });
      add("text", { x: x(i), y: y(d.signups) - 9, "text-anchor": "middle", class: "v" + (isLast ? " last" : "") }, int(d.signups));
      add("text", { x: x(i), y: h - 22, "text-anchor": "middle" }, d.week);
    });
  };
  draw();
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 100); });

  // Plans
  const totalMrr = D.plans.reduce((s, p) => s + p.mrr_usd, 0);
  const maxShare = Math.max(...D.plans.map(p => p.mrr_usd / totalMrr));
  $("plans").innerHTML = D.plans.map(p => {
    const share = p.mrr_usd / totalMrr;
    return `<tr><td>${esc(p.plan)}</td><td>${int(p.accounts)}</td><td>${usd(p.mrr_usd)}</td>
      <td class="share"><div class="share-cell"><i style="width:${(share / maxShare * 100).toFixed(1)}%"></i><span>${pct1(share * 100)}</span></div></td>
      <td>${usd(p.mrr_usd / p.accounts)}</td></tr>`;
  }).join("");
})();
</script>
</body>
</html>
