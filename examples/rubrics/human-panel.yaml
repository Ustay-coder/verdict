# Hiring debrief: AI pre-screen + two interviewers, majority on a binary hire decision.
name: Engineering hiring debrief
scale: { type: numeric, min: 1, max: 4 }
criteria:
  - id: coding
    name: Coding exercise
    weight: 2
    judge: { type: llm, provider: anthropic, instructions: Evaluate correctness, clarity and tests of the submitted code. }
  - id: system_design
    name: System design
    weight: 2
    judge: { type: human, raters: [interviewer_1, interviewer_2], required: 2 }
    rater: mean
  - id: communication
    name: Communication
    weight: 1
    judge: [{ type: human, raters: [interviewer_1], required: 1 }, { type: human, raters: [interviewer_2], required: 1 }, { type: llm, provider: anthropic }]
    rater: median
  - id: hire
    name: Hire?
    weight: 0
    scale: { type: binary, labels: [no hire, hire] }
    judge: { type: human, raters: [interviewer_1, interviewer_2, hiring_manager], required: 3 }
    rater: majority
aggregation:
  method: weighted_mean
  gates: [{ criterion: hire, min: 1, message: Majority of the panel must vote hire }]
  passThreshold: 70
